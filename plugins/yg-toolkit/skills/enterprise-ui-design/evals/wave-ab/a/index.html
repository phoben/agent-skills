<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>出库波次工作台</title>
<style>
  :root{--navy:#172b4d;--blue:#1769e0;--blue2:#eaf2ff;--ink:#172033;--muted:#667085;--line:#dfe5ef;--bg:#f5f7fb;--card:#fff;--green:#087443;--amber:#9a6700;--red:#b42318}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Microsoft YaHei",Arial,sans-serif}
  button,select{font:inherit} button{cursor:pointer;border:0;border-radius:6px;font-weight:600;padding:9px 14px}.top{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 32px;gap:20px}.brand{font-size:17px;font-weight:700}.crumb{color:#b8c5db}.shell{max-width:1380px;margin:0 auto;padding:22px 28px 34px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.head h1{font-size:23px;margin:0 0 3px}.head p{margin:0;color:var(--muted)}.badge{display:inline-flex;gap:6px;align-items:center;border-radius:20px;padding:4px 10px;background:#edf7f1;color:var(--green);font-size:12px;font-weight:700}.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.layout{display:grid;grid-template-columns:minmax(550px,1fr) 405px;gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px #10182808}.card-hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.card-hd h2{font-size:16px;margin:0}.sub{color:var(--muted);font-size:12px}.step{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e8ecf3;color:#59677d}.step.active{color:var(--blue);font-weight:700}.step.active b{background:var(--blue);color:#fff}.warehouse{padding:17px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}label{font-weight:600}select{height:36px;border:1px solid #bfc9d9;border-radius:6px;padding:0 28px 0 10px;background:#fff;min-width:225px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;background:#f8fafc;color:#475467;font-size:12px;padding:10px 18px;border-bottom:1px solid var(--line)}.table td{padding:14px 18px;border-bottom:1px solid #edf0f5}.table tr:last-child td{border:0}.table tr.selected{background:#f2f7ff}.type{display:inline-block;padding:3px 7px;border-radius:4px;background:#f1f4f8;color:#475467;font-size:12px}.num{font-variant-numeric:tabular-nums}.choice{width:18px;height:18px;accent-color:var(--blue)}.right{position:sticky;top:14px}.summary{padding:0 18px}.empty{padding:30px 4px;color:var(--muted);text-align:center}.picked{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #edf0f5}.picked:last-child{border:0}.picked strong{display:block;font-size:13px}.picked span{color:var(--muted);font-size:12px}.remove{margin-left:auto;background:transparent;color:#59677d;padding:3px 2px}.totals{background:#f8fafc;margin:10px 0 16px;padding:12px;border-radius:7px;display:flex;justify-content:space-between}.actions{border-top:1px solid var(--line);padding:15px 18px;display:grid;gap:9px}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid #b8c5d8;color:#344054}.primary:disabled{background:#a9c8f7;cursor:not-allowed}.risk{display:flex;gap:8px;align-items:center;font-size:12px;color:#59677d}.risk input{accent-color:var(--blue)}.notice{margin-bottom:16px;padding:14px 16px;border-radius:8px;border:1px solid;display:flex;gap:12px;align-items:flex-start}.notice h3{margin:0 0 3px;font-size:14px}.notice p{margin:0;color:#475467}.notice.fail{background:#fff3f2;border-color:#fecdca}.notice.fail h3{color:var(--red)}.notice.pending{background:#fff8e8;border-color:#fedf89}.notice.pending h3{color:var(--amber)}.notice.success{background:#ecfdf3;border-color:#abefc6}.notice.success h3{color:var(--green)}.notice button{margin-left:auto;white-space:nowrap;padding:7px 10px}.draftbar{margin-bottom:16px;background:#eff6ff;border:1px solid #bfdcff;padding:11px 14px;border-radius:8px;display:flex;align-items:center;gap:10px}.draftbar strong{color:#175cd3}.draftbar span{color:#475467;font-size:13px}@media(max-width:950px){.layout{grid-template-columns:1fr}.right{position:static}.shell{padding:16px}.top{padding:0 16px}.head{align-items:start;gap:12px}.step{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand">仓储执行中心</div><div class="crumb">出库管理 / 波次作业</div></header>
<main class="shell"><div class="head"><div><h1>新建出库波次</h1><p>把可用来源组合为一个波次；下达前可在右侧核对，失败后继续调整原草稿。</p></div><span id="stateBadge" class="badge">编辑中</span></div>
<section id="noticeArea"></section><section id="draftBar"></section>
<div class="layout"><section class="card"><div class="card-hd"><h2>选择出库来源</h2><div class="step"><span class="active"><b>1</b>选择来源</span><span><b>2</b>核对并下达</span></div></div><div class="warehouse"><label for="warehouse">作业仓库</label><select id="warehouse"><option value="">请选择仓库</option><option value="east">华东成品仓</option><option value="north">华北备货仓</option></select><span class="sub" id="warehouseHint">请先选择仓库</span></div><table class="table"><thead><tr><th style="width:48px"></th><th>来源类型</th><th>业务单号</th><th>货主</th><th style="text-align:right">计划量</th></tr></thead><tbody id="sourceRows"></tbody></table></section>
<aside class="card right"><div class="card-hd"><div><h2>本波次内容</h2><div class="sub" id="summaryCaption">尚未选择来源</div></div><span class="sub" id="draftId"></span></div><div class="summary" id="pickedList"></div><div class="actions"><button class="primary" id="dispatchBtn">创建并下达</button><button class="secondary" id="saveBtn">仅存草稿</button><label class="risk"><input type="checkbox" id="uncertain"> 模拟下达结果暂不确定</label></div></aside></div></main>
<script>
const sources=[{id:'ck041',type:'直接出库单',no:'CK-20260923-041',owner:'华源商贸',qty:24},{id:'zc007',type:'装车单',no:'ZC-20260923-007',owner:'新禾制造',qty:12},{id:'ck052',type:'直接出库单',no:'CK-20260923-052',owner:'华源商贸',qty:8}];
let selected=[], draft=null, mode='editing', queryDone=false;
const $=id=>document.getElementById(id); const fmt=n=>n+' 件';
function render(){const valid=$('warehouse').value==='east';$('warehouseHint').textContent=valid?'已切换到华东成品仓':'切换仓库会清空当前选择';$('warehouseHint').style.color=valid?'#087443':'';
 $('sourceRows').innerHTML=sources.map(s=>`<tr class="${selected.includes(s.id)?'selected':''}"><td><input class="choice" type="checkbox" ${selected.includes(s.id)?'checked':''} ${valid?'':'disabled'} onchange="pick('${s.id}',this.checked)"></td><td><span class="type">${s.type}</span></td><td><strong>${s.no}</strong></td><td>${s.owner}</td><td class="num" style="text-align:right">${fmt(s.qty)}</td></tr>`).join('');
 const picks=sources.filter(s=>selected.includes(s.id)); $('summaryCaption').textContent=picks.length?`已选 ${picks.length} 条来源，合计 ${fmt(picks.reduce((n,s)=>n+s.qty,0))}`:'尚未选择来源'; $('pickedList').innerHTML=picks.length?picks.map(s=>`<div class="picked"><div><strong>${s.no}</strong><span>${s.type} · ${s.owner} · ${fmt(s.qty)}</span></div><button class="remove" onclick="removePick('${s.id}')">移除</button></div>`).join('')+`<div class="totals"><span>计划量合计</span><strong>${fmt(picks.reduce((n,s)=>n+s.qty,0))}</strong></div>`:'<div class="empty">从左侧勾选来源后，在这里核对本波次内容。</div>';
 $('dispatchBtn').disabled=!valid||!picks.length||mode==='pending'; $('saveBtn').disabled=!valid||!picks.length||mode==='pending'; $('draftId').textContent=draft?'草稿 '+draft:'';
 const map={editing:'编辑中',draft:'草稿已保存',failed:'待调整',pending:'待查询',success:'已下达'}; $('stateBadge').textContent=map[mode]; $('stateBadge').style.background=mode==='failed'?'#fff1f0':mode==='pending'?'#fff8e8':mode==='success'?'#ecfdf3':'#edf7f1';
 $('draftBar').innerHTML=draft?`<div class="draftbar"><strong>${draft}</strong><span>${mode==='success'?'已下达，来源已锁定为本次波次内容。':'草稿仍在当前页面，可直接调整来源后再次下达。'}</span></div>`:'';
}
function pick(id,on){if(mode==='success')return; selected=on?[...selected,id]:selected.filter(x=>x!==id);render()} function removePick(id){pick(id,false)}
function createDraft(){if(!draft)draft='WAV-20260923-001';}
function notice(type,title,text,action,label){$('noticeArea').innerHTML=`<div class="notice ${type}"><div><h3>${title}</h3><p>${text}</p></div>${action?`<button class="${type==='pending'?'primary':'secondary'}" onclick="${action}">${label}</button>`:''}</div>`}
function save(){createDraft();mode='draft';notice('success','草稿已保存','已保留 '+selected.length+' 条来源。你可继续调整后再下达。');render()}
function dispatch(){createDraft();if($('uncertain').checked&&!queryDone){mode='pending';notice('pending','下达结果暂不确定','请求超时，尚不能确认是否已创建波次。请先查询本次操作结果，确认后再决定是否重试。','checkResult()','查询原操作结果');render();return}if(selected.includes('zc007')){mode='failed';notice('fail','下达未完成：装车单来源库存不足','草稿 '+draft+' 已保留；未产生部分库存预占或部分作业任务。移除失败来源后，可在原草稿中重试。');render();return}mode='success';notice('success','波次已创建并下达','波次 '+draft+' 已下达，共 '+selected.length+' 条来源、'+fmt(sources.filter(s=>selected.includes(s.id)).reduce((n,s)=>n+s.qty,0))+'。');render()}
function checkResult(){queryDone=true;mode='draft';$('uncertain').checked=false;notice('success','已查询原操作结果','本次请求未创建波次，也未预占库存或生成任务。原草稿仍可安全下达一次。');render()}
$('warehouse').addEventListener('change',e=>{selected=[];draft=null;mode='editing';queryDone=false;$('noticeArea').innerHTML='';render()});$('saveBtn').onclick=save;$('dispatchBtn').onclick=dispatch;render();
</script></body></html>
