<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出库波次工作台 · 原型</title>
  <style>
    :root{--blue:#1677ff;--blue-weak:#eaf3ff;--ink:#1f2937;--muted:#697586;--line:#e5e7eb;--page:#f5f7fa;--success:#16a34a;--warn:#d97706;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 "Microsoft YaHei",Arial,sans-serif}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:18px}.brand{font-size:16px;font-weight:700;color:#172033}.crumb{color:var(--muted);border-left:1px solid var(--line);padding-left:18px}.page{max-width:1440px;margin:0 auto;padding:20px 28px 32px}.titlebar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:20px;margin:0 0 5px}h2{font-size:15px;margin:0}.sub{color:var(--muted);font-size:13px}.pill{font-size:12px;border:1px solid #bfdbfe;background:var(--blue-weak);color:#1559b0;border-radius:12px;padding:3px 9px}.notice{display:none;border:1px solid #f5c56b;background:#fffbeb;padding:11px 14px;border-radius:4px;margin-bottom:14px;color:#8a4b08}.notice.show{display:flex;align-items:center;justify-content:space-between;gap:14px}.step{background:#fff;border:1px solid var(--line);border-radius:4px;padding:13px 16px;display:flex;align-items:center;gap:26px;margin-bottom:14px}.step-item{display:flex;align-items:center;gap:8px;color:var(--muted)}.step-num{width:22px;height:22px;display:grid;place-items:center;border:1px solid #cbd5e1;border-radius:50%;font-size:12px}.step-item.active{color:var(--blue);font-weight:600}.step-item.active .step-num{color:#fff;background:var(--blue);border-color:var(--blue)}.warehouse{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:14px}label{color:#4b5563}select{width:190px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:3px;background:#fff;color:var(--ink)}.hint{color:var(--muted);font-size:12px}.work{display:grid;grid-template-columns:minmax(620px,1fr) 380px;gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:4px}.card-head{min-height:52px;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.card-body{padding:14px 16px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px}.search{width:240px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:3px}.table{width:100%;border-collapse:collapse}.table th{font-weight:600;color:#4b5563;background:#f8fafc;text-align:left;white-space:nowrap}.table td,.table th{border-bottom:1px solid var(--line);padding:11px 9px}.table tr:last-child td{border-bottom:0}.table tr.selected{background:#f4f8ff}.qty{text-align:right}.type{color:#475569}.tag{display:inline-block;border-radius:3px;padding:2px 6px;font-size:12px}.tag.ready{color:#247a45;background:#edf9f0;border:1px solid #bee7c8}.tag.draft{color:#a16207;background:#fefce8;border:1px solid #fde68a}.summary{position:sticky;top:12px}.summary-lines{display:grid;gap:11px}.summary-row{display:flex;justify-content:space-between}.total{border-top:1px solid var(--line);padding-top:12px;font-weight:700;font-size:16px}.selected-list{margin-top:14px;border-top:1px solid var(--line)}.selected-item{padding:11px 0;border-bottom:1px solid var(--line)}.selected-item:last-child{border:0}.item-main{display:flex;justify-content:space-between;gap:8px}.item-meta{margin-top:4px;color:var(--muted);font-size:12px}.link-btn{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;font:inherit}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.btn{min-height:34px;padding:7px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:3px;cursor:pointer;color:#334155;font:inherit}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{grid-column:1/-1;border-color:#fecaca;color:#b91c1c;background:#fff}.btn:disabled{opacity:.52;cursor:not-allowed}.result{display:none;margin-top:14px;padding:13px;border-radius:4px;border:1px solid}.result.show{display:block}.result.fail{background:#fff7f7;border-color:#fecaca}.result.ok{background:#f0fdf4;border-color:#bbf7d0}.result.pending{background:#fffbeb;border-color:#fde68a}.result-title{font-weight:700;margin-bottom:5px}.result p{margin:4px 0;color:#4b5563}.result .btn{margin-top:9px;margin-right:8px}.empty{padding:28px 8px;color:var(--muted);text-align:center}.toast{position:fixed;right:24px;bottom:24px;background:#1f2937;color:#fff;padding:10px 14px;border-radius:4px;display:none;box-shadow:0 4px 16px #0002}.toast.show{display:block}.mini{font-size:12px;color:var(--muted);margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}@media(max-width:1050px){.work{grid-template-columns:1fr}.summary{position:static}.page{padding:16px}.top{padding:0 16px}}@media(max-width:680px){.warehouse,.titlebar{align-items:flex-start;flex-direction:column}.step{gap:12px;overflow:auto}.table th:nth-child(3),.table td:nth-child(3){display:none}}
  </style>
</head>
<body>
  <header class="top"><span class="brand">ERP 管理后台</span><span class="crumb">仓储管理 / 出库波次 / 新建波次</span></header>
  <main class="page">
    <div class="titlebar"><div><h1>组建出库波次</h1><div class="sub">从同一仓库的可用来源组成波次；选择、核对和下达始终保留在同一工作区。</div></div><div><button id="newWave" class="btn" hidden>新建波次</button> <span class="pill">模拟数据 · 不写入库存</span></div></div>
    <section id="pendingNotice" class="notice"><span><strong>上次下达结果暂不确定。</strong> 请先查询原操作结果，确认后才能重试，避免重复创建波次。</span><button class="btn primary" id="queryResult">查询原操作结果</button></section>
    <section class="step"><div class="step-item active"><span class="step-num">1</span>选择来源</div><div class="step-item active"><span class="step-num">2</span>核对波次</div><div class="step-item"><span class="step-num">3</span>保存或下达</div></section>
    <section class="warehouse"><label for="warehouse"><strong>仓库</strong></label><select id="warehouse"><option value="east">华东成品仓</option><option value="north">华北周转仓（无可用来源）</option></select><span id="warehouseHint" class="hint">切换仓库会清空当前选择，防止将来源带入其他仓库。</span></section>
    <section class="work">
      <article class="card"><div class="card-head"><div><h2>可选来源单据</h2><div class="sub">勾选后立即加入右侧核对清单</div></div><span id="candidateCount" class="sub">3 条可选</span></div><div class="card-body"><div class="toolbar"><input id="search" class="search" placeholder="按单号或货主筛选" /><span class="hint">模拟值</span></div><div id="candidateTable"></div></div></article>
      <aside class="card summary"><div class="card-head"><div><h2>本波次核对</h2><div id="draftState" class="sub">尚未保存</div></div><span class="tag draft" id="statusTag">草稿编辑中</span></div><div class="card-body"><div class="summary-lines"><div class="summary-row"><span>仓库</span><strong id="warehouseName">华东成品仓</strong></div><div class="summary-row"><span>已选来源</span><strong id="selectedCount">0 条</strong></div><div class="summary-row total"><span>计划量合计</span><span id="totalQty">0</span></div></div><div id="selectedList" class="selected-list"><div class="empty">请从左侧勾选来源单据</div></div><div class="actions"><button id="saveDraft" class="btn">仅存草稿</button><button id="release" class="btn primary">创建并下达</button><button id="validateCandidates" class="btn" disabled>重新校验候选</button><button id="uncertain" class="btn danger">模拟：下达结果暂不确定</button></div><div id="result" class="result"></div><p class="mini">下达失败时，原草稿和已选来源会留在这里；系统不会保留部分库存预占或作业任务。</p></div></aside>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const sources=[
      {id:'ck041',type:'直接出库单',no:'CK-20260923-041',owner:'华源商贸',qty:24},
      {id:'zc007',type:'装车单',no:'ZC-20260923-007',owner:'新禾制造',qty:12},
      {id:'ck052',type:'直接出库单',no:'CK-20260923-052',owner:'华源商贸',qty:8}
    ];
    const selected=new Set(); let draftSaved=false, pending=false, queried=false, released=false, submitting=false, needsRevalidation=false;
    const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function chosen(){return sources.filter(x=>selected.has(x.id))} function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
    function render(){const q=$('search').value.trim(); const available=$('warehouse').value==='east'; const locked=submitting||released; const rows=available?sources.filter(x=>!q||`${x.no}${x.owner}${x.type}`.includes(q)):[]; $('candidateCount').textContent=available?`${rows.length} 条可选`:'0 条可选'; $('candidateTable').innerHTML=rows.length?`<table class="table"><thead><tr><th style="width:45px"></th><th>来源类型</th><th>业务单号</th><th>货主</th><th class="qty">计划量</th><th>状态</th></tr></thead><tbody>${rows.map(x=>`<tr class="${selected.has(x.id)?'selected':''}"><td><input aria-label="选择 ${x.no}" type="checkbox" data-id="${x.id}" ${selected.has(x.id)?'checked':''} ${locked?'disabled':''}></td><td class="type">${x.type}</td><td><strong>${x.no}</strong></td><td>${x.owner}</td><td class="qty">${x.qty}</td><td><span class="tag ready">可选</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">该仓库暂无可选来源单据</div>';
      document.querySelectorAll('[data-id]').forEach(el=>el.onchange=e=>{e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);needsRevalidation=(needsRevalidation||draftSaved)&&!released;draftSaved=false;clearResult();render()});
      const list=chosen(), qty=list.reduce((n,x)=>n+x.qty,0); $('selectedCount').textContent=`${list.length} 条`;$('totalQty').textContent=qty;$('selectedList').innerHTML=list.length?list.map(x=>`<div class="selected-item"><div class="item-main"><strong>${x.no}</strong><button class="link-btn" aria-label="移除 ${x.no}" data-remove="${x.id}" ${locked?'disabled':''}>移除 ${x.no}</button></div><div class="item-meta">${x.type} · ${x.owner} · 计划量 ${x.qty}</div></div>`).join(''):'<div class="empty">请从左侧勾选来源单据</div>'; document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{selected.delete(el.dataset.remove);draftSaved=false;needsRevalidation=true;clearResult();render()}); $('draftState').textContent=released?'波次 W-20260923-001 已下达（只读）':draftSaved?'草稿 W-20260923-001 已保留':'尚未保存'; $('statusTag').textContent=released?'已下达':submitting?'处理中':'草稿编辑中'; $('statusTag').className=`tag ${released?'ready':'draft'}`;
      $('warehouse').disabled=locked; $('search').disabled=locked; $('saveDraft').disabled=locked; $('release').disabled=locked||needsRevalidation; $('validateCandidates').disabled=locked||!needsRevalidation; $('uncertain').disabled=locked; $('newWave').hidden=!released;
    }
    function result(kind,title,body,actions=''){const el=$('result');el.className=`result show ${kind}`;el.innerHTML=`<div class="result-title">${title}</div><p>${body}</p>${actions}`}
    function clearResult(){if(!released)$('result').className='result'}
    $('warehouse').onchange=e=>{selected.clear();draftSaved=false;released=false;pending=false;queried=false;needsRevalidation=false;$('pendingNotice').classList.remove('show');$('warehouseName').textContent=e.target.value==='east'?'华东成品仓':'华北周转仓';$('warehouseHint').textContent='已清空选择；来源不能跨仓库保留。';$('result').className='result';render();toast('已切换仓库并清空当前选择')}; $('search').oninput=render;
    $('saveDraft').onclick=()=>{if(!chosen().length)return toast('请先选择至少一条来源单据');draftSaved=true;result('ok','草稿已保存','草稿 W-20260923-001 已保留，可继续调整来源或选择下达。');render()};
    function revalidate(){submitting=true;result('pending','正在重新校验候选','正在按当前仓库、草稿和占用情况校验候选来源；校验完成前不能下达。');render();setTimeout(()=>{submitting=false;needsRevalidation=false;result('ok','候选已重新校验','当前已选来源可继续下达。候选结果为模拟值，生产环境应由服务端重新查询。');render()},550)}
    $('release').onclick=()=>{if(released)return; if(pending&&!queried)return result('pending','需先查询原操作结果','当前请求状态不确定。请使用页面顶部“查询原操作结果”，确认后再决定是否重试。');if(needsRevalidation)return result('pending','请先重新校验候选','失败恢复或调整来源后，需先使用“重新校验候选”，确认当前选择仍可下达。');if(!chosen().length)return toast('请先选择至少一条来源单据');submitting=true;result('pending','正在创建并下达','提交处理中，已锁定来源选择、保存和下达，避免重复操作。');render();setTimeout(()=>{submitting=false;if(selected.has('zc007')){draftSaved=true;released=false;needsRevalidation=true;result('fail','下达未完成：装车单来源库存不足','ZC-20260923-007 库存不足。草稿 W-20260923-001 已保留，未产生部分库存预占或作业任务。调整来源后请使用“重新校验候选”再下达。');render();return}draftSaved=true;released=true;pending=false;result('ok','波次已创建并下达','波次 W-20260923-001 已下达，包含 '+chosen().map(x=>x.no).join('、')+'，计划量合计 '+chosen().reduce((n,x)=>n+x.qty,0)+'。该波次现为只读，请查看波次或新建波次。');render()},550)};
    $('uncertain').onclick=()=>{if(!chosen().length)return toast('请先选择来源，再模拟下达结果暂不确定');pending=true;queried=false;$('pendingNotice').classList.add('show');result('pending','下达结果暂不确定','请求已提交但结果尚未确认。为避免重复创建，请先查询原操作结果。');window.scrollTo({top:0,behavior:'smooth'})};
    $('validateCandidates').onclick=revalidate;
    $('queryResult').onclick=()=>{queried=true;pending=false;$('pendingNotice').classList.remove('show');result('ok','原操作结果已确认','未创建新的波次，草稿 W-20260923-001 仍可编辑。现在可以调整来源后重新下达。')};
    $('newWave').onclick=()=>{selected.clear();draftSaved=false;released=false;pending=false;queried=false;needsRevalidation=false;$('result').className='result';render();toast('已新建空白波次草稿')}; render();
  </script>
</body>
</html>
