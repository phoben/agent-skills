<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>标准 BOM 维护｜布局原型</title>
  <style>
    :root{--blue:#1677ff;--ink:#1f2329;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7fa;--good:#52a675;--warn:#d58b18;--danger:#c74444;--panel:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif} button,input,select{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91caff;outline-offset:1px}
    .top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px}.brand{font-weight:650;font-size:16px;white-space:nowrap}.crumb{color:var(--muted);border-left:1px solid var(--line);padding-left:18px}.top-spacer{flex:1}.sim{font-size:12px;color:#ad6800;background:#fff7e6;border:1px solid #ffe7ba;padding:3px 8px;border-radius:3px}.mode{display:flex;background:#f1f3f5;padding:3px;border-radius:4px;gap:2px}.mode button{border:0;background:transparent;padding:5px 11px;color:#596275;border-radius:3px}.mode button.active{background:#fff;color:var(--blue);box-shadow:0 1px 2px #00000012}
    .app{height:calc(100vh - 56px);min-height:560px;padding:16px 24px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.hint{display:flex;align-items:center;gap:10px;min-height:30px;color:#4d5969}.hint strong{font-size:13px}.recommended{background:#e6f4ff;color:#0958d9;border:1px solid #bae0ff;border-radius:3px;padding:2px 7px;font-size:12px}.hint span:last-child{color:var(--muted);font-size:12px}
    .toolbar,.object-band,.head{background:var(--panel);border:1px solid var(--line);border-radius:4px}.toolbar{padding:10px 12px;display:flex;align-items:center;gap:8px}.toolbar label{color:var(--muted);white-space:nowrap}.toolbar input:not([type=checkbox]){height:30px;width:220px;border:1px solid #d9dfe8;border-radius:3px;padding:0 8px}.toolbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}.btn{border:1px solid #d9dfe8;background:#fff;border-radius:3px;padding:6px 12px;color:#344054}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{color:#b8bec8;background:#f5f5f5;border-color:#e5e7eb;cursor:not-allowed}.btn.danger{color:#c53b3b}
    [hidden]{display:none!important}.workspace{min-height:0;flex:1;display:grid;gap:12px}.legacy .workspace{grid-template-columns:272px minmax(0,1fr)}.focus .navigator{display:none}.navigator{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:auto}.nav-title{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}.product{border-bottom:1px solid #f0f1f3;padding:11px 12px}.product.selected{background:#eaf3ff;border-left:3px solid var(--blue);padding-left:9px}.product button{background:none;border:0;text-align:left;width:100%;padding:0;color:inherit}.sku{font-weight:600}.product small{color:var(--muted);display:block;margin-top:2px}.ver{margin:8px 0 0 13px;display:flex;align-items:center;justify-content:space-between;color:#556070;font-size:13px}.ver button{width:auto;color:#556070}.ver.selected{color:var(--blue);font-weight:600}.tag{font-size:12px;padding:1px 6px;border-radius:3px;white-space:nowrap}.tag.good{background:#f0f9f3;color:#2c8452}.tag.draft{background:#fff7e6;color:#ad6800}.tag.history{background:#f3f4f6;color:#667085}.tag.temp{background:#fff7e6;color:#ad6800}.tag.readonly{background:#f3f4f6;color:#667085}
    .content{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}.object-band,.head{padding:12px 16px}.object-band{display:grid;grid-template-columns:minmax(300px,1fr) auto auto auto;align-items:center;gap:14px}.object-id{display:flex;align-items:baseline;gap:9px}.object-id h1{font-size:18px;margin:0;font-weight:650}.object-id span{color:var(--muted)}.versions{display:flex;gap:4px}.versions button{border:1px solid #d9dfe8;background:#fff;padding:5px 10px;border-radius:3px;color:#4d5969}.versions button.selected{color:var(--blue);border-color:#91caff;background:#e6f4ff}.object-actions{display:flex;gap:8px;white-space:nowrap}.head{display:flex;align-items:center;gap:15px}.head h1{margin:0;font-size:18px}.head .sub{color:var(--muted);font-size:13px}.head .actions{margin-left:auto;display:flex;gap:8px}.summary{display:flex;gap:18px;color:#596275;font-size:13px}.summary b{color:#1f2329;font-weight:600}
    .table-wrap{background:#fff;border:1px solid var(--line);border-radius:4px;min-height:0;overflow:auto;display:flex;flex-direction:column}.table-note{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:#596275;display:flex;justify-content:space-between}.table-note strong{color:#344054}table{border-collapse:collapse;width:100%;min-width:850px;table-layout:fixed}th{height:38px;background:#fafafa;color:#667085;font-size:12px;font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:0 12px;white-space:nowrap}td{border-bottom:1px solid #f0f1f3;padding:9px 12px;vertical-align:middle}.name{font-weight:600}.name small{display:block;color:#7b8493;font-weight:400;font-size:12px}.quantity{display:flex;align-items:center;gap:5px}.quantity input{width:72px;height:30px;border:1px solid #d9dfe8;border-radius:3px;padding:0 7px;text-align:right}.quantity input[readonly],.spec.readonly{background:#f7f8fa;color:#667085}.spec input{height:30px;width:100%;border:1px solid #d9dfe8;border-radius:3px;padding:0 7px}.spec.readonly{height:30px;padding:5px 7px;border:1px solid #e5e7eb;border-radius:3px}.check{display:flex;gap:6px;align-items:center;white-space:nowrap}.foot{padding:8px 12px;color:#7b8493;font-size:12px}.empty{padding:45px;text-align:center;color:#7b8493}.dirty{color:#d97706;font-size:13px}.locked{color:#b42318;font-size:13px}
    .toast{position:fixed;right:24px;bottom:24px;background:#1f2937;color:#fff;padding:10px 14px;border-radius:4px;box-shadow:0 4px 14px #0003;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:5}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:4}.modal.show{display:flex}.dialog{width:420px;background:#fff;border-radius:5px;box-shadow:0 12px 36px #0004;padding:20px}.dialog h2{font-size:17px;margin:0 0 10px}.dialog p{color:#596275;margin:0 0 18px}.dialog .dialog-actions{text-align:right;display:flex;justify-content:flex-end;gap:8px}.statebar{display:flex;gap:8px;align-items:center;font-size:12px;color:#667085}.statebar button{border:0;background:none;color:var(--blue);padding:0}
    @media(max-width:1300px){.app{padding:12px 16px}.legacy .workspace{grid-template-columns:220px minmax(0,1fr)}.toolbar input{width:180px}.object-band{grid-template-columns:minmax(250px,1fr) auto auto}.object-band .summary{grid-column:1/2}.head{padding:10px 12px}.head .sub{display:none}th,td{padding-left:9px;padding-right:9px}}
    @media(max-width:900px){.legacy .workspace{grid-template-columns:1fr}.navigator{display:none}.app{overflow:auto;height:auto}.object-band{display:block}.object-band>*{margin-bottom:8px}.head{align-items:flex-start}.head .actions{margin-left:0;flex-wrap:wrap}.toolbar{flex-wrap:wrap}.toolbar .right{margin-left:0}}
  </style>
</head>
<body>
<header class="top"><div class="brand">AOY ERP</div><div class="crumb">主数据 / 标准 BOM 维护</div><div class="top-spacer"></div><span class="sim">模拟数据 · 不写入业务系统</span><div class="mode" aria-label="布局候选"><button id="modeLegacy" class="active" onclick="setMode('legacy')">候选 A：左侧导航</button><button id="modeFocus" onclick="setMode('focus')">候选 B：全宽核对</button></div></header>
<main id="app" class="app legacy">
  <div class="hint"><strong id="modeTitle">候选 A：左侧对象导航</strong><span class="recommended">推荐</span><span id="modeText">本题需要辨认 V3、V2 与复制后的 V4；左侧保持成品和版本上下文，主表在 1280px 下仍能完整展示核对列。</span></div>
  <section class="toolbar" aria-label="查询"><label for="filter">成品 SKU</label><input id="filter" placeholder="输入 CP-1008 或名称" oninput="applyFilter()"><button class="btn" onclick="clearFilter()">重置</button><div class="right"><label class="check"><input id="permission" type="checkbox" onchange="togglePermission()"> 模拟无更新权限</label><span id="dirtyState" class="statebar"></span></div></section>
  <div class="workspace">
    <aside class="navigator" aria-label="成品与版本列表"><div class="nav-title">成品 SKU 与版本</div><div id="navList"></div></aside>
    <section class="content">
      <div id="objectBand" class="object-band"><div class="object-id"><h1 id="productName">便携终端整机</h1><span id="productSku">CP-1008</span></div><div class="versions" id="versionTabs"></div><div class="summary" id="summary"></div><div class="object-actions" id="objectActions"></div></div>
      <div id="legacyHead" class="head" hidden><div><h1 id="legacyName">便携终端整机 <span class="tag good">生效</span></h1><div class="sub">CP-1008 · 版本与成品切换保留在左侧列表</div></div><div class="actions" id="legacyActions"></div></div>
      <div class="table-wrap" id="tableWrap"><div class="table-note"><span><strong id="treeTitle">V3 子件清单</strong> · 整树保存前请核对全部 3 个子件</span><span id="viewState"></span></div><table aria-label="BOM 子件表"><colgroup><col style="width:22%"><col style="width:12%"><col style="width:16%"><col style="width:16%"><col style="width:12%"><col style="width:12%"><col style="width:10%"></colgroup><thead><tr><th>子件</th><th>来源</th><th>用途</th><th>用量 / 单位</th><th>规格</th><th>约束</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有匹配的成品 SKU。请清除查询条件后重试。</div><div class="foot">模拟：分页、虚拟滚动、真实权限与并发冲突须由业务系统能力验证。</div></div>
    </section>
  </div>
</main>
<div id="toast" class="toast" role="status"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle">确认操作</h2><p id="dialogText"></p><div class="dialog-actions"><button class="btn" onclick="closeModal()">取消</button><button id="confirmBtn" class="btn primary">确认</button></div></div></div>
<script>
  const products={
    'CP-1008':{name:'便携终端整机',versions:{V3:{status:'生效',rows:[['WL-2001','主控板','已有 SKU','核心控制','1','块','32GB',false],['WL-2002','外壳','已有 SKU','结构保护','2','件','黑色',false],['TMP-039','缓冲垫片','临时物料','减震缓冲','4','片','厚度 1.0mm',true]]},V2:{status:'历史',rows:[['WL-2001','主控板','已有 SKU','核心控制','1','块','32GB',false],['WL-2002','外壳','已有 SKU','结构保护','2','件','黑色',false],['TMP-039','缓冲垫片','临时物料','减震缓冲','4','片','厚度 1.0mm',true]]}}},
    'CP-1020':{name:'扫码底座',versions:{V2:{status:'生效',rows:[['WL-3101','底座壳体','已有 SKU','结构支撑','1','件','灰色',false],['WL-3102','触点组件','已有 SKU','充电连接','1','套','Pogo Pin',false]]}}}
  };
  let currentSku='CP-1008',currentVersion='V3',mode='legacy',dirty=false,noPermission=false,activeModal=null;
  const statusClass=s=>s==='生效'?'good':s==='草稿'?'draft':'history';
  function current(){return products[currentSku].versions[currentVersion]}
  function renderNav(){const keyword=document.getElementById('filter').value.trim().toLowerCase();let html='';Object.entries(products).filter(([sku,p])=>!keyword||sku.toLowerCase().includes(keyword)||p.name.includes(keyword)).forEach(([sku,p])=>{html+=`<div class="product ${sku===currentSku?'selected':''}"><button onclick="chooseProduct('${sku}')"><span class="sku">${sku}</span><small>${p.name}</small></button>${Object.entries(p.versions).map(([v,x])=>`<div class="ver ${sku===currentSku&&v===currentVersion?'selected':''}"><button onclick="choose('${sku}','${v}')">${v}</button><span class="tag ${statusClass(x.status)}">${x.status}</span></div>`).join('')}</div>`});document.getElementById('navList').innerHTML=html||'<div class="empty">未找到成品</div>'}
  function render(){const p=products[currentSku],v=current(),editable=v.status==='生效'&&!noPermission;document.getElementById('productName').textContent=p.name;document.getElementById('productSku').textContent=currentSku;document.getElementById('legacyName').innerHTML=`${p.name} <span class="tag ${statusClass(v.status)}">${v.status}</span>`;document.getElementById('treeTitle').textContent=`${currentVersion} 子件清单`;document.getElementById('summary').innerHTML=`<span>当前版本 <b>${currentVersion}</b></span><span>子件 <b>${v.rows.length} 项</b></span><span>状态 <b><i class="tag ${statusClass(v.status)}">${v.status}</i></b></span>`;document.getElementById('versionTabs').innerHTML=Object.entries(p.versions).map(([x,d])=>`<button class="${x===currentVersion?'selected':''}" onclick="requestChoose('${currentSku}','${x}')">${x} · ${d.status}</button>`).join('');
    document.getElementById('rows').innerHTML=v.rows.map((r,i)=>`<tr><td><span class="name">${r[0]}<small>${r[1]}</small></span></td><td><span class="tag ${r[2]==='临时物料'?'temp':'readonly'}">${r[2]}</span></td><td>${r[3]}</td><td><div class="quantity"><input aria-label="${r[1]}用量" type="number" min="0.001" step="0.1" value="${r[4]}" ${editable?'':'readonly'} oninput="changeValue(${i},4,this.value)"><span>${r[5]}</span></div></td><td>${r[2]==='已有 SKU'?`<div class="spec readonly" title="已有 SKU 的规格由物料资料维护，只读">${r[6]}</div>`:`<div class="spec"><input aria-label="${r[1]}规格" value="${r[6]}" ${editable?'':'readonly'} oninput="changeValue(${i},6,this.value)"></div>`}</td><td><span class="check"><input type="checkbox" checked disabled> 必需</span>${r[7]?'<span class="tag temp">虚拟件</span>':''}</td><td>${editable?'<button class="btn" onclick="showToast(\'该原型只验证编辑与核对，不演示删除子件。\')">详情</button>':'<span class="locked">只读</span>'}</td></tr>`).join('');
    const actions=`<button class="btn" ${editable?'':'disabled'} onclick="save()">保存 BOM</button><button class="btn primary" ${v.status==='生效'&&!noPermission?'':'disabled'} onclick="copyVersion()">复制为新版本</button>`;document.getElementById('legacyActions').innerHTML=actions;document.getElementById('objectActions').innerHTML=actions;document.getElementById('viewState').innerHTML=noPermission?'<span class="locked">无更新权限：仅可查看</span>':dirty?'<span class="dirty">存在未保存修改</span>':'<span>已保存</span>';document.getElementById('dirtyState').innerHTML=dirty?'<span class="dirty">● 未保存修改</span>':'<span>✓ 已保存</span>';renderNav();}
  function choose(sku,v){currentSku=sku;currentVersion=v;dirty=false;render()}function chooseProduct(sku){const v=Object.entries(products[sku].versions).find(([,x])=>x.status==='生效')?.[0]||Object.keys(products[sku].versions)[0];requestChoose(sku,v)}function requestChoose(sku,v){if(dirty){openModal('离开前保存修改？','当前 BOM 有未保存修改。离开将丢失本次编辑。',()=>{dirty=false;choose(sku,v)},'放弃修改');return}choose(sku,v)}
  function changeValue(i,key,val){current().rows[i][key]=val;dirty=true;renderStateOnly()}function renderStateOnly(){document.getElementById('viewState').innerHTML=dirty?'<span class="dirty">存在未保存修改</span>':'<span>已保存</span>';document.getElementById('dirtyState').innerHTML=dirty?'<span class="dirty">● 未保存修改</span>':'<span>✓ 已保存</span>'}
  function save(){if(noPermission)return;if(!current().rows.every(r=>Number(r[4])>0)){showToast('保存失败：用量必须大于 0；请在对应行修正。');return}dirty=false;renderStateOnly();showToast(`${currentSku} ${currentVersion} 已模拟保存：已核对 ${current().rows.length} 个子件。`)}
  function copyVersion(){openModal('复制 V3 为新版本草稿？','将复制当前生效 BOM 的全部子件和临时物料资料，生成 V4 草稿；V3 将继续保持生效。',()=>{const copy=JSON.parse(JSON.stringify(current()));copy.status='草稿';products[currentSku].versions.V4=copy;currentVersion='V4';dirty=false;render();showToast('已生成 V4 草稿，三个子件及刚保存的修改均已保留。')},'确认复制')}
  function openModal(title,text,fn,label){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=text;const btn=document.getElementById('confirmBtn');btn.textContent=label;btn.onclick=()=>{closeModal();fn()};document.getElementById('modal').classList.add('show');btn.focus()}function closeModal(){document.getElementById('modal').classList.remove('show')}
  function setMode(m){mode=m;document.getElementById('app').className='app '+m;document.getElementById('modeLegacy').classList.toggle('active',m==='legacy');document.getElementById('modeFocus').classList.toggle('active',m==='focus');document.getElementById('objectBand').hidden=m==='legacy';document.getElementById('legacyHead').hidden=m!=='legacy';document.getElementById('modeTitle').textContent=m==='focus'?'候选 B：全宽核对工作台':'候选 A：左侧对象导航';document.querySelector('.recommended').textContent=m==='legacy'?'推荐':'对照';document.getElementById('modeText').textContent=m==='focus'?'省去侧栏后，长 BOM 可获得更大的横向核对空间；本题仅三项子件，尚未观察到足以替代版本导航的收益。':'本题需要辨认 V3、V2 与复制后的 V4；左侧保持成品和版本上下文，主表在 1280px 下仍能完整展示核对列。';render()}
  function applyFilter(){renderNav();const text=document.getElementById('filter').value.trim();document.getElementById('tableWrap').style.display=text&&!(currentSku.includes(text)||products[currentSku].name.includes(text))?'none':'flex';document.getElementById('empty').hidden=true}function clearFilter(){document.getElementById('filter').value='';document.getElementById('tableWrap').style.display='flex';renderNav()}function togglePermission(){noPermission=document.getElementById('permission').checked;if(noPermission&&dirty){dirty=false;showToast('已切换为无更新权限演示，未保存修改未保留。')}render()}function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),3600)}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body></html>
