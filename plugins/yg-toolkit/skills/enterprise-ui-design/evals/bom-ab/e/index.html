<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>标准 BOM 维护｜变更单原型</title>
  <style>
    :root{--blue:#1677ff;--blue-weak:#eaf3ff;--ink:#1f2937;--muted:#667085;--line:#e6eaf0;--bg:#f5f7fa;--panel:#fff;--green:#1f9d62;--amber:#bd7b14;--red:#d14343}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.shell{min-width:1060px}.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px}.logo{font-weight:700;color:#172b4d;letter-spacing:.2px}.crumb{color:#98a2b3;font-size:13px}.crumb strong{color:#475467;font-weight:500}.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:3px;font-size:12px;white-space:nowrap}.tag.blue{background:#eaf3ff;color:#1769d1}.tag.green{background:#eaf8f0;color:#16834d}.tag.gray{background:#f0f2f5;color:#667085}.tag.amber{background:#fff6df;color:#a9650a}.layout{display:grid;grid-template-columns:276px minmax(690px,1fr) 322px;gap:16px;padding:16px 22px;max-width:1600px;margin:auto}.layout.compact{grid-template-columns:276px minmax(0,1fr)}.layout.compact .right{display:none}.layout.compact .change-head{padding:10px 14px;border:0}.layout.compact .change-head h2{display:inline;font-size:13px;margin:0}.layout.compact .change-head p{display:inline;margin-left:10px}.layout.compact .change-count,.layout.compact .changes,.layout.compact .right-foot{display:none}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(16,24,40,.02)}.side{padding:16px 0;height:calc(100vh - 88px);min-height:632px}.side-head{padding:0 16px 12px;display:flex;align-items:center;justify-content:space-between}.side h2,.content h1{margin:0;font-size:16px;line-height:24px}.search{margin:0 16px 14px;display:flex;border:1px solid #d0d5dd;border-radius:4px;overflow:hidden}.search input{border:0;outline:0;min-width:0;padding:8px 10px;width:100%;font:inherit}.sku{padding:10px 16px;border-top:1px solid #f0f2f5;cursor:pointer}.sku:hover{background:#f8fbff}.sku.selected{background:#edf5ff;border-left:3px solid var(--blue);padding-left:13px}.sku-row{display:flex;justify-content:space-between;gap:8px;align-items:center}.sku strong{font-size:13px}.sku-name{font-size:12px;color:var(--muted);margin-top:2px}.versions{margin-top:8px;display:flex;gap:5px}.version{border:1px solid #e4e7ec;background:#fff;border-radius:3px;padding:3px 7px;color:#667085;font-size:12px;cursor:pointer}.version.current{border-color:#91caff;color:#1769d1;background:#f0f7ff;font-weight:600}.content{min-width:0}.hero{padding:16px 18px 12px}.hero-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.eyebrow{color:#667085;font-size:12px;margin-bottom:3px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;color:#667085;font-size:12px}.versionbar{margin-top:16px;border-top:1px solid #eef0f3;padding-top:11px;display:flex;gap:8px;align-items:center}.vnode{border:1px solid #e1e7ef;border-radius:4px;padding:6px 10px;color:#667085;font-size:12px;cursor:pointer}.vnode.active{border-color:#91caff;background:#f0f7ff;color:#1769d1}.vnode .dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;margin-right:5px}.vline{height:1px;width:20px;background:#dbe2ea}.button{height:32px;padding:0 12px;border:1px solid #d0d5dd;background:#fff;border-radius:4px;color:#344054;font:inherit;cursor:pointer}.button:hover{border-color:#91caff;color:#1769d1}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.primary:hover{background:#0f65d4}.button[disabled]{opacity:.45;cursor:not-allowed}.toolbar{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.toolbar-title{font-weight:600}.toolbar-note{font-size:12px;color:var(--muted);margin-left:8px}.table-wrap{padding:0 14px 14px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{text-align:left;color:#667085;font-size:12px;font-weight:500;background:#fafbfc;border-bottom:1px solid var(--line);padding:10px 9px}td{padding:12px 9px;border-bottom:1px solid #edf0f3;vertical-align:middle;font-size:13px}tr.changed{background:#fbfdff}tr.changed td:first-child{box-shadow:inset 3px 0 0 var(--blue)}.material{font-weight:600}.code{font-size:12px;color:#7b8794;margin-top:2px}.spec-ro{color:#475467}.spec-ro small{display:block;color:#98a2b3;font-size:11px;margin-top:2px}.after{color:#1769d1;font-weight:600}.from{color:#98a2b3;text-decoration:line-through;margin-right:5px}.row-action{border:0;color:#1769d1;background:transparent;padding:3px 0;cursor:pointer;font:inherit;font-size:12px}.row-action:disabled{color:#98a2b3;cursor:not-allowed}.right{height:calc(100vh - 88px);min-height:632px;position:sticky;top:16px;display:flex;flex-direction:column}.change-head{padding:16px;border-bottom:1px solid var(--line)}.change-head h2{font-size:16px;margin:0 0 5px}.change-head p{margin:0;color:var(--muted);font-size:12px}.change-count{margin-left:auto}.changes{padding:12px;overflow:auto;flex:1}.empty{border:1px dashed #d6dce5;border-radius:4px;padding:24px 14px;text-align:center;color:#98a2b3;font-size:13px;margin-top:2px}.change{border:1px solid #d7e7ff;background:#fbfdff;border-radius:5px;padding:11px;margin-bottom:10px}.change-top{display:flex;gap:8px;justify-content:space-between}.change-title{font-weight:600;font-size:13px}.change-field{font-size:12px;color:#667085;margin-top:2px}.remove{border:0;background:transparent;color:#667085;cursor:pointer;font-size:16px;line-height:18px}.compare{margin-top:9px;color:#667085;font-size:12px}.compare b{color:#1769d1;font-weight:600}.field{margin-top:9px}.field label{display:block;font-size:12px;color:#667085;margin-bottom:4px}.field input{height:30px;width:100%;border:1px solid #b9c7d8;border-radius:3px;padding:0 8px;font:inherit;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(22,119,255,.1)}.constraint{margin-top:8px;background:#f4f6f8;border-radius:3px;padding:6px 7px;color:#667085;font-size:11px}.right-foot{border-top:1px solid var(--line);padding:12px;background:#fff}.foot-note{font-size:12px;color:#667085;margin-bottom:9px}.foot-actions{display:flex;gap:8px}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:10;align-items:center;justify-content:center}.modal-backdrop.show{display:flex}.modal{background:#fff;width:620px;border-radius:7px;box-shadow:0 16px 44px rgba(16,24,40,.22)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}.modal-body{padding:16px 18px;color:#475467}.modal-body p{margin:0 0 12px}.review-list{border:1px solid var(--line);border-radius:4px;overflow:hidden}.review-row{display:grid;grid-template-columns:1.35fr .7fr 1.1fr;padding:9px 11px;border-bottom:1px solid #edf0f3;font-size:13px}.review-row:last-child{border:0}.review-row.head{background:#fafbfc;color:#667085;font-size:12px}.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:24px;top:72px;z-index:20;background:#edfff4;border:1px solid #b7ebc9;color:#177245;border-radius:4px;padding:10px 14px;box-shadow:0 4px 13px rgba(0,0,0,.08);display:none}.toast.show{display:block}.saved-note{display:none;margin:12px 14px 0;padding:8px 10px;background:#f0f9f4;border:1px solid #c8ead7;color:#1b7f4b;border-radius:4px;font-size:12px}.saved-note.show{display:block}@media(max-height:760px){.layout{padding-top:10px}.hero{padding-top:12px}.right,.side{height:calc(100vh - 76px);min-height:580px}.topbar{height:50px}.layout{grid-template-columns:250px minmax(650px,1fr) 286px;gap:10px;padding-left:14px;padding-right:14px}.layout.compact{grid-template-columns:250px minmax(0,1fr)}.table-wrap{padding-bottom:8px}td{padding:9px 7px}.hero-title{gap:8px}.versionbar{margin-top:11px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="logo">AOY ERP</div><div class="crumb">主数据 / <strong>标准 BOM 维护</strong></div><span class="tag gray">模拟数据 · 本地原型</span></header>
  <main id="appLayout" class="layout compact">
    <aside class="panel side"><div class="side-head"><h2>成品 SKU</h2><span class="tag gray">2 个</span></div><div class="search"><input id="search" placeholder="搜索 SKU 或名称" oninput="filterSku()"></div><div id="skuList"></div></aside>
    <section class="content"><div class="panel hero"><div class="hero-title"><div><div class="eyebrow">当前维护对象</div><h1 id="title">CP-1008　便携终端整机</h1><div class="meta"><span id="stateTag" class="tag green">● 生效版本 V3</span><span>3 个子件</span><span>最后保存：2026-09-23 16:40</span></div></div><button id="editBtn" class="button primary" onclick="startEdit()">发起本次变更</button></div><div class="versionbar" id="versionbar"></div></div>
      <div class="panel" style="margin-top:16px"><div class="toolbar"><div><span class="toolbar-title">完整 BOM 基线</span><span class="toolbar-note" id="tableHint">这是已保存的 V3 内容</span></div><span class="tag blue" id="baselineCount">全量 3 项</span></div><div id="savedNote" class="saved-note">V3 已保存。本次变更已成为新的稳定基线，可复制为新版本草稿。</div><div class="table-wrap"><table><thead><tr><th style="width:22%">子件</th><th style="width:13%">来源</th><th style="width:11%">用途</th><th style="width:14%">用量</th><th style="width:10%">单位</th><th style="width:19%">规格</th><th style="width:11%">操作</th></tr></thead><tbody id="bomRows"></tbody></table></div></div>
    </section>
    <aside class="panel right"><div class="change-head"><div style="display:flex;align-items:center"><div><h2>本次变更单</h2><p>仅记录尚未保存的差异，可逐项撤销</p></div><span id="changeCount" class="tag blue change-count">0 项</span></div></div><div id="changes" class="changes"></div><div class="right-foot"><div id="footNote" class="foot-note">开始变更后，在左侧清单选择要调整的字段。</div><div class="foot-actions"><button id="saveBtn" class="button primary" disabled onclick="openReview()">核对完整结果并保存</button><button id="copyBtn" class="button" disabled onclick="openCopy()">复制为 V4 草稿</button></div></div></aside>
  </main>
</div>
<div id="modalBack" class="modal-backdrop"><div class="modal"><div id="modalTitle" class="modal-head"></div><div id="modalBody" class="modal-body"></div><div id="modalFoot" class="modal-foot"></div></div></div><div id="toast" class="toast"></div>
<script>
const products=[{sku:'CP-1008',name:'便携终端整机',versions:['V3','V2']},{sku:'CP-1020',name:'扫码底座',versions:['V2']}];
const original=[{code:'WL-2001',name:'主控板',source:'已有 SKU',use:'生产用',qty:'1',unit:'块',spec:'32GB',type:'existing'},{code:'WL-2002',name:'外壳',source:'已有 SKU',use:'生产用',qty:'2',unit:'件',spec:'黑色',type:'existing'},{code:'TMP-039',name:'缓冲垫片',source:'临时物料',use:'辅料',qty:'4',unit:'片',spec:'厚度 1.0mm',type:'temp'}];
let currentSku='CP-1008',currentVer='V3',saved=JSON.parse(JSON.stringify(original)),changes={},editing=false,hasV4=false,pendingAction=null;
function clone(v){return JSON.parse(JSON.stringify(v))}function activeData(){return saved.map(x=>({...x,qty:changes[x.code]?.qty??x.qty,spec:changes[x.code]?.spec??x.spec}))}function diffCount(){return Object.keys(changes).length}
function render(){document.getElementById('appLayout').classList.toggle('compact',!editing&&!diffCount());renderSku();renderVersions();renderTable();renderChanges();document.getElementById('title').textContent=currentSku==='CP-1008'?'CP-1008　便携终端整机':'CP-1020　扫码底座';const isV3=currentSku==='CP-1008'&&currentVer==='V3';document.getElementById('stateTag').className='tag '+(currentVer==='V3'?'green':currentVer==='V4'?'blue':'gray');document.getElementById('stateTag').textContent=currentVer==='V3'?'● 生效版本 V3':currentVer==='V4'?'草稿版本 V4':'历史版本 V2';document.getElementById('editBtn').style.display=isV3&&!editing?'inline-block':'none';document.getElementById('tableHint').textContent=editing?'蓝色标记为基线上的待提交覆盖；其余行保持稳定。':currentVer==='V4'?'V4 已继承 V3 保存后的完整内容。':'这是已保存的 '+currentVer+' 内容；发起变更后显示本次变更单。';document.getElementById('savedNote').classList.toggle('show',hasV4||(!editing&&currentVer==='V3'&&saved[1].qty==='2.5'));}
function renderSku(){const term=document.getElementById('search').value.trim();document.getElementById('skuList').innerHTML=products.filter(p=>(p.sku+p.name).includes(term)).map(p=>`<div class="sku ${p.sku===currentSku?'selected':''}" onclick="chooseSku('${p.sku}')"><div class="sku-row"><strong>${p.sku}</strong>${p.sku==='CP-1008'?'<span class="tag green">生效 V3</span>':'<span class="tag green">生效 V2</span>'}</div><div class="sku-name">${p.name}</div>${p.sku==='CP-1008'?'<div class="versions"><span class="version '+(currentSku==='CP-1008'&&currentVer==='V3'?'current':'')+'" onclick="event.stopPropagation();chooseVersion(\'V3\')">V3 生效</span><span class="version '+(currentSku==='CP-1008'&&currentVer==='V2'?'current':'')+'" onclick="event.stopPropagation();chooseVersion(\'V2\')">V2 历史</span>'+(hasV4?'<span class="version '+(currentVer==='V4'?'current':'')+'" onclick="event.stopPropagation();chooseVersion(\'V4\')">V4 草稿</span>':'')+'</div>':''}</div>`).join('')}
function renderVersions(){let vs=currentSku==='CP-1008'?['V2','V3',...(hasV4?['V4']:[])]:['V2'];document.getElementById('versionbar').innerHTML=vs.map((v,i)=>`${i?'<span class="vline"></span>':''}<span class="vnode ${v===currentVer?'active':''}" onclick="chooseVersion('${v}')">${v==='V3'?'<span class="dot"></span>':''}${v} · ${v==='V3'?'生效':v==='V4'?'草稿':'历史'}</span>`).join('')}
function renderTable(){let editable=editing&&currentSku==='CP-1008'&&currentVer==='V3';document.getElementById('bomRows').innerHTML=activeData().map((r,i)=>{let c=changes[r.code],qty=c?.qty||r.qty,spec=c?.spec||r.spec;return `<tr class="${c?'changed':''}"><td><div class="material">${r.name}</div><div class="code">${r.code}</div></td><td><span class="tag ${r.type==='temp'?'amber':'gray'}">${r.source}</span></td><td>${r.use}</td><td>${c?.qty?'<span class="from">'+r.qty+'</span><span class="after">'+qty+'</span>':qty}</td><td>${r.unit}</td><td>${c?.spec?'<span class="from">'+r.spec+'</span><span class="after">'+spec+'</span>':'<span class="spec-ro">'+spec+(r.type==='existing'?'<small>SKU 资料，只读</small>':'<small>临时物料 · 虚拟件</small>')+'</span>'}</td><td>${editable?(r.code==='WL-2002'?'<button class="row-action" onclick="addQty()">'+(c?.qty?'编辑变更':'调整用量')+'</button>':r.code==='TMP-039'?'<button class="row-action" onclick="addSpec()">'+(c?.spec?'编辑变更':'调整规格')+'</button>':'<button class="row-action" disabled title="已有 SKU 规格在 BOM 内只读">规格只读</button>'):'—'}</td></tr>`}).join('')}
function renderChanges(){let rows=Object.entries(changes);document.getElementById('changeCount').textContent=rows.length+' 项';document.getElementById('changes').innerHTML=rows.length?rows.map(([code,c])=>{let r=saved.find(x=>x.code===code),field=c.qty?'用量':'规格',old=c.qty?r.qty:r.spec,val=c.qty?c.qty:c.spec;return `<div class="change"><div class="change-top"><div><div class="change-title">${r.name}</div><div class="change-field">${r.code} · ${field}</div></div><button class="remove" aria-label="撤销此项变更" onclick="removeChange('${code}')">×</button></div><div class="compare">基线 <span>${old}</span>　→　<b>${val}</b></div><div class="field"><label>新${field}${c.qty?'（'+r.unit+'）':''}</label><input ${c.qty?'type="number" min="0" step="0.1"':'type="text"'} value="${val}" oninput="updateChange('${code}','${c.qty?'qty':'spec'}',this.value)"></div>${r.type==='temp'?'<div class="constraint">临时物料：虚拟件（固定）</div>':''}</div>`}).join(''):'<div class="empty">尚无待提交变更<br><span style="font-size:12px">完整 BOM 保持为稳定基线</span></div>';let n=rows.length;document.getElementById('saveBtn').disabled=!n;document.getElementById('copyBtn').disabled=editing||currentSku!=='CP-1008'||currentVer!=='V3';document.getElementById('footNote').textContent=n?'有 '+n+' 项待提交变更。保存前将同时显示完整结果和本次意图。':editing?'请从完整清单选择需要调整的字段。':'复制只基于已保存的生效 V3。'}
function startEdit(){editing=true;document.getElementById('editBtn').style.display='none';render()}
function addQty(){changes['WL-2002']={qty:changes['WL-2002']?.qty||'2.5'};render()}
function addSpec(){changes['TMP-039']={spec:changes['TMP-039']?.spec||'厚度 1.2mm'};render()}
function updateChange(code,key,value){changes[code]={[key]:value};renderTable();document.getElementById('saveBtn').disabled=!diffCount();}
function removeChange(code){delete changes[code];render()}
function chooseSku(sku){attemptLeave(()=>{currentSku=sku;currentVer=sku==='CP-1008'?'V3':'V2';render()})}function chooseVersion(v){attemptLeave(()=>{currentVer=v;render()})}
function attemptLeave(action){if(editing&&diffCount()){pendingAction=action;showModal('离开前有 '+diffCount()+' 项未保存变更','变更单中的修改尚未写入 V3。继续离开会放弃本次全部变更。','取消','放弃变更并离开',()=>hideModal(),()=>{changes={};editing=false;hideModal();pendingAction()})}else action()}
function openReview(){let data=activeData();showModal('核对完整结果并保存','<p>请确认全量 BOM 与本次意图。保存后，两项覆盖将写入 <b>V3</b>，并成为后续复制的基线。</p><div class="review-list"><div class="review-row head"><span>子件</span><span>用量</span><span>规格</span></div>'+data.map(r=>'<div class="review-row"><span>'+r.name+' <small style="color:#98a2b3">'+r.code+'</small></span><span>'+r.qty+' '+r.unit+'</span><span>'+r.spec+'</span></div>').join('')+'</div><p style="font-size:12px;margin-top:12px;color:#667085">本次意图：外壳用量 2 → 2.5；缓冲垫片规格 厚度 1.0mm → 厚度 1.2mm。</p>','返回修改','确认保存 V3',()=>hideModal(),save)}
function save(){saved=activeData();changes={};editing=false;hideModal();showToast('V3 已保存，完整 BOM 基线已更新。');render()}
function openCopy(){showModal('复制 V3 为 V4 草稿','将复制 <b>CP-1008 的已保存 V3 完整内容</b>，生成新的 V4 草稿。V3 仍保持生效，本次操作不改变 V3。','取消','确认复制为 V4 草稿',()=>hideModal(),()=>{hasV4=true;currentVer='V4';hideModal();showToast('已创建 V4 草稿，可核对继承的 3 个子件。');render()})}
function showModal(title,body,cancel,ok,onCancel,onOk){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML='<button class="button" id="cancelM">'+cancel+'</button><button class="button primary" id="okM">'+ok+'</button>';document.getElementById('cancelM').onclick=onCancel;document.getElementById('okM').onclick=onOk;document.getElementById('modalBack').classList.add('show')}function hideModal(){document.getElementById('modalBack').classList.remove('show')}function showToast(text){let t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}function filterSku(){renderSku()}window.addEventListener('beforeunload',e=>{if(editing&&diffCount()){e.preventDefault();e.returnValue='本次变更尚未保存。'}});render();
</script>
</body></html>
