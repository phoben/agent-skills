<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>标准 BOM 维护 · 模拟原型</title>
  <style>
    :root{--blue:#1677ff;--ink:#1f2937;--muted:#667085;--line:#e6eaf0;--bg:#f5f7fa;--card:#fff;--green:#13a36e;--amber:#d97706;--red:#d92d20}*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 12px;color:#344054}button:hover{border-color:#8bbcff;color:var(--blue)}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:var(--red)}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:16px}.brand{font-size:17px;font-weight:700}.crumb{color:var(--muted);border-left:1px solid var(--line);padding-left:16px}.simulation{margin-left:auto;color:#9a6700;background:#fff5d6;border:1px solid #f5d889;border-radius:16px;padding:3px 10px;font-size:12px}.page{padding:18px 24px;max-width:1600px;margin:auto}.filter{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 16px;display:flex;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:5px;color:#475467;font-size:12px}.field input,.field select{height:32px;border:1px solid #d0d5dd;border-radius:4px;padding:0 9px;min-width:190px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;margin-top:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}.panel-hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:600}.count{font-size:12px;color:var(--muted);font-weight:400}.bom-list{padding:8px}.bom-item{padding:12px;border-radius:6px;border:1px solid transparent;margin-bottom:5px;cursor:pointer}.bom-item:hover{background:#f7faff}.bom-item.active{background:#eef6ff;border-color:#b6d7ff}.sku{font-weight:600}.item-sub{margin-top:3px;color:var(--muted);font-size:12px}.versions{margin-top:9px;padding-top:8px;border-top:1px dashed #d9e1ea;display:flex;gap:6px;flex-wrap:wrap}.ver{font-size:12px;padding:2px 6px;border-radius:3px;background:#f2f4f7;color:#475467}.ver.current{background:#e8f7ef;color:#067647}.ver.draft{background:#fff7e5;color:#b54708}.workspace{min-width:0}.context{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}.product{font-size:17px;font-weight:700}.meta{color:var(--muted);font-size:12px}.versions-bar{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.tab{padding:6px 10px;border-radius:4px;font-size:13px;cursor:pointer}.tab.active{color:var(--blue);background:#eaf3ff;font-weight:600}.spacer{flex:1}.notice{margin:12px 16px;padding:9px 12px;border-left:3px solid #76aefb;background:#f5f9ff;color:#475467;font-size:12px}.table-wrap{padding:0 16px 15px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:830px}th{text-align:left;color:#475467;background:#f8fafc;font-weight:600;font-size:12px}th,td{border:1px solid var(--line);padding:10px 9px;vertical-align:middle}.source{font-size:12px;padding:2px 6px;border-radius:3px}.existing{color:#155eef;background:#eff8ff}.temp{color:#b54708;background:#fff7e5}.bool{color:#087443;background:#ecfdf3}.readonly{color:#667085;background:#f2f4f7;padding:5px 7px;border-radius:3px;display:inline-block;min-width:86px}.inline{width:82px;border:1px solid #98a2b3;border-radius:4px;padding:5px 7px}.spec-input{width:140px}.row-action{font-size:12px;color:var(--blue);border:0;padding:3px;background:transparent}.footer{padding:13px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}.save-state{font-size:12px;color:var(--muted)}.dirty{color:#b54708}.overlay{position:fixed;inset:0;background:rgba(16,24,40,.38);display:none;align-items:center;justify-content:center;z-index:10}.dialog{width:480px;background:#fff;border-radius:8px;box-shadow:0 18px 48px rgba(16,24,40,.25);padding:20px}.dialog h2{font-size:18px;margin:0 0 10px}.dialog p{color:#475467;margin:7px 0}.dialog ul{background:#f8fafc;padding:10px 12px 10px 28px;color:#475467}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:24px;top:70px;display:none;background:#ecfdf3;color:#067647;border:1px solid #abefc6;border-radius:6px;padding:10px 14px;box-shadow:0 4px 12px #0001;z-index:20}@media(max-width:900px){.page{padding:12px}.layout{grid-template-columns:1fr}.filter{flex-wrap:wrap}.context{flex-wrap:wrap}.top{padding:0 14px}}
  </style>
</head>
<body>
  <header class="top"><span class="brand">制造数据管理</span><span class="crumb">物料管理 / 标准 BOM 维护</span><span class="simulation">模拟数据 · 不会写入真实系统</span></header>
  <main class="page">
    <section class="filter" aria-label="BOM 查询条件"><label class="field">成品 SKU<input id="search" placeholder="输入编码或名称" value=""></label><label class="field">生效状态<select id="status"><option value="all">全部</option><option value="active">仅生效</option><option value="draft">仅草稿</option></select></label><button class="primary" id="query">查询</button><button id="reset">重置</button></section>
    <section class="layout">
      <aside class="panel"><div class="panel-hd">成品 SKU <span class="count" id="resultCount">2 个结果</span></div><div class="bom-list" id="bomList"></div></aside>
      <section class="panel workspace"><div class="context"><div><div class="product" id="productName">CP-1008 · 便携终端整机</div><div class="meta">成品 SKU 在编辑中锁定；保存会提交当前版本的完整子件清单</div></div></div><div class="versions-bar" id="versionTabs"></div><div class="notice" id="scopeHint">当前查看 V3 的完整组成：3 个子件。请在保存前核对来源、用量、单位与规格。</div><div class="table-wrap"><table><thead><tr><th style="width:52px">序号</th><th>子件</th><th>来源</th><th>用途</th><th>用量</th><th>单位</th><th>规格</th><th>必需</th><th>虚拟件</th><th>操作</th></tr></thead><tbody id="componentRows"></tbody></table></div><div class="footer"><span class="save-state" id="saveState">当前版本已保存</span><span class="spacer"></span><button id="restore">恢复已保存值</button><button class="primary" id="save">保存 V3</button></div></section>
    </section>
  </main>
  <div class="overlay" id="copyDialog"><div class="dialog"><h2>复制为新版本草稿</h2><p>即将把 <strong>CP-1008 · 便携终端整机 V3（生效）</strong> 复制为 <strong>V4 草稿</strong>。</p><ul><li>将保留当前 3 个子件、临时物料资料及已保存的修改值。</li><li>V3 仍保持生效；复制不会发布或审批 V4。</li><li>该操作仅在本地模拟数据中演示。</li></ul><div class="dialog-actions"><button id="cancelCopy">取消</button><button class="primary" id="confirmCopy">确认复制</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const initial=[
      {code:'WL-2001',name:'主控板',source:'已有 SKU',usage:'生产',qty:'1',unit:'块',spec:'32GB',required:true,virtual:false},
      {code:'WL-2002',name:'外壳',source:'已有 SKU',usage:'生产',qty:'2',unit:'件',spec:'黑色',required:true,virtual:false},
      {code:'TMP-039',name:'缓冲垫片',source:'临时物料',usage:'生产',qty:'4',unit:'片',spec:'厚度 1.0mm',required:true,virtual:true}
    ];
    let data=JSON.parse(JSON.stringify(initial)), saved=JSON.stringify(data), selected='CP-1008', version='V3', copied=false;
    const $=s=>document.querySelector(s); const clone=x=>JSON.parse(JSON.stringify(x));
    function bomItems(){return [{sku:'CP-1008',name:'便携终端整机',versions:['V3','V2'].concat(copied?['V4']:[])},{sku:'CP-1020',name:'扫码底座',versions:['V2']}];}
    function renderList(){const q=$('#search').value.trim().toLowerCase(), st=$('#status').value;const list=bomItems().filter(x=>(!q||`${x.sku}${x.name}`.toLowerCase().includes(q))&&!(st==='active'&&!x.versions.includes('V3')&&x.sku==='CP-1008')).filter(x=>!(st==='draft'&&!x.versions.includes('V4')));$('#resultCount').textContent=`${list.length} 个结果`;$('#bomList').innerHTML=list.length?list.map(x=>`<div class="bom-item ${x.sku===selected?'active':''}" data-sku="${x.sku}"><div class="sku">${x.sku}</div><div class="item-sub">${x.name}</div><div class="versions">${x.versions.map(v=>`<span class="ver ${v==='V3'||(x.sku==='CP-1020'&&v==='V2')?'current':v==='V4'?'draft':''}">${v}${v==='V3'||(x.sku==='CP-1020'&&v==='V2')?' · 生效':v==='V4'?' · 草稿':' · 历史'}</span>`).join('')}</div></div>`).join(''):'<div class="bom-item"><div class="item-sub">未找到符合条件的 BOM</div></div>';document.querySelectorAll('.bom-item[data-sku]').forEach(e=>e.onclick=()=>{if(isDirty()&&!confirm('当前 V3 有未保存修改，离开将丢失修改。确定切换吗？'))return;selected=e.dataset.sku;version=selected==='CP-1008'?'V3':'V2';renderAll()})}
    function renderTabs(){let vs=selected==='CP-1008'?['V3','V2'].concat(copied?['V4']:[]):['V2'];$('#versionTabs').innerHTML=vs.map(v=>`<span class="tab ${v===version?'active':''}" data-v="${v}">${v} ${v==='V3'||selected==='CP-1020'?'（生效）':v==='V4'?'（草稿）':'（历史）'}</span>`).join('')+`<span class="spacer"></span>${selected==='CP-1008'&&version==='V3'?'<button id="copy">复制为 V4 草稿</button>':''}`;document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{if(e.dataset.v!==version&&isDirty()&&!confirm('当前 V3 有未保存修改，切换版本将丢失修改。确定切换吗？'))return;version=e.dataset.v;renderAll()});const c=$('#copy');if(c)c.onclick=()=>$('#copyDialog').style.display='flex'}
    function renderRows(){const editable=selected==='CP-1008'&&(version==='V3'||version==='V4');const shown=version==='V2'?[initial[0],{...initial[1],qty:'2'},initial[2]]:data;$('#componentRows').innerHTML=shown.map((r,i)=>`<tr><td>${i+1}</td><td><strong>${r.code}</strong><br><span class="meta">${r.name}</span></td><td><span class="source ${r.source==='已有 SKU'?'existing':'temp'}">${r.source}</span></td><td>${r.usage}</td><td>${editable&&r.code==='WL-2002'?`<input class="inline" data-key="qty" data-i="${i}" value="${r.qty}">`:`${r.qty}`}</td><td>${r.unit}</td><td>${editable&&r.source==='临时物料'?`<input class="inline spec-input" data-key="spec" data-i="${i}" value="${r.spec}">`:`<span class="readonly" title="已有 SKU 的规格由 SKU 资料维护">${r.spec}${r.source==='已有 SKU'?' · 只读':''}</span>`}</td><td><span class="bool">${r.required?'必需':'可选'}</span></td><td>${r.virtual?'<span class="bool">是</span>':'否'}</td><td>${editable?'<button class="row-action" disabled title="本原型聚焦行内编辑">查看</button>':'—'}</td></tr>`).join('');document.querySelectorAll('input[data-i]').forEach(el=>el.oninput=()=>{data[+el.dataset.i][el.dataset.key]=el.value;updateDirty()});}
    function isDirty(){return selected==='CP-1008'&&version==='V3'&&JSON.stringify(data)!==saved}function updateDirty(){const dirty=isDirty();$('#saveState').textContent=dirty?'有未保存修改：请核对完整子件清单后保存':'当前版本已保存';$('#saveState').className='save-state '+(dirty?'dirty':'');$('#save').disabled=!dirty;}
    function renderAll(){const is1008=selected==='CP-1008';$('#productName').textContent=is1008?'CP-1008 · 便携终端整机':'CP-1020 · 扫码底座';$('#scopeHint').textContent=is1008?`当前查看 ${version} 的完整组成：3 个子件。请在保存前核对来源、用量、单位与规格。`:'当前查看 V2 的完整组成：2 个子件。';renderList();renderTabs();renderRows();$('#save').style.display=is1008&&version==='V3'?'inline-block':'none';$('#restore').style.display=is1008&&version==='V3'?'inline-block':'none';updateDirty()}
    function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}
    $('#query').onclick=renderList;$('#reset').onclick=()=>{$('#search').value='';$('#status').value='all';renderList()};$('#save').onclick=()=>{if(!isDirty())return;saved=JSON.stringify(data);updateDirty();toast('已模拟保存 V3：完整子件清单已提交（未写入真实服务端）')};$('#restore').onclick=()=>{if(isDirty()&&confirm('恢复到上次已保存的值？当前修改将丢失。')){data=JSON.parse(saved);renderAll()}};$('#cancelCopy').onclick=()=>$('#copyDialog').style.display='none';$('#confirmCopy').onclick=()=>{if(isDirty()){alert('请先保存 V3 的修改，再复制新版本。');return}copied=true;version='V4';$('#copyDialog').style.display='none';renderAll();toast('已模拟复制 V3 为 V4 草稿，已保留 3 个子件与修改值')};window.onbeforeunload=e=>{if(isDirty()){e.preventDefault();e.returnValue=''}};renderAll();
  </script>
</body>
</html>
