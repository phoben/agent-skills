name: DataPull 单平台兼容性验收

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      bootstrap:
        required: true
        type: string
      install_missing:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.platform }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 60
    steps:
      - name: 检出固定提交
        uses: actions/checkout@v6

      - name: 安装 Node.js 最低支持版本
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: 准备 macOS 数据库客户端
        if: inputs.bootstrap == 'macos'
        shell: bash
        run: |
          brew install mysql-client libpq sqlcmd
          echo "$(brew --prefix mysql-client)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --cask powershell
          fi
          pwsh -NoProfile -NonInteractive -Command 'Install-Module SqlServer -Scope CurrentUser -Force'

      - name: 准备 Ubuntu 数据库客户端
        if: inputs.bootstrap == 'ubuntu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl mysql-client
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location --output packages-microsoft-prod.deb \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y mssql-tools18 powershell
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          pwsh -NoProfile -NonInteractive -Command 'Install-Module SqlServer -Scope CurrentUser -Force'

      - name: 准备 Windows 数据库客户端
        if: inputs.bootstrap == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Add-ExecutableDirectory([string]$Executable) {
            $command = Get-Command $Executable -ErrorAction SilentlyContinue
            if ($null -ne $command) {
              Split-Path -Parent $command.Source | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              return
            }
            $candidate = Get-ChildItem -Path 'C:\Program Files' -Filter "$Executable.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $candidate) { throw "安装后仍未找到 $Executable.exe" }
            $candidate.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$($candidate.DirectoryName);$env:PATH"
          }

          if (-not (Get-Command mysql -ErrorAction SilentlyContinue)) {
            choco install mysql --yes --no-progress
          }
          $postgresBin = 'C:\Program Files\PostgreSQL\18\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $postgresBin 'pg_dump.exe'))) {
            choco install postgresql18 --yes --no-progress --params '/Password:datapull-ci'
          }
          if (-not (Get-Command sqlcmd -ErrorAction SilentlyContinue)) {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($null -eq $winget) { throw 'Windows 托管镜像缺少 sqlcmd，且 winget 不可用。' }
            winget install --id Microsoft.Sqlcmd --exact --silent --accept-package-agreements --accept-source-agreements
          }
          $postgresBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$postgresBin;$env:PATH"
          Add-ExecutableDirectory mysql
          Add-ExecutableDirectory sqlcmd
          if (-not (Get-Module -ListAvailable SqlServer)) {
            Install-Module SqlServer -Scope CurrentUser -Force -AllowClobber
          }

      - name: 信任 SQL Server CA（Windows）
        if: inputs.bootstrap == 'windows'
        shell: pwsh
        env:
          DATAPULL_SQLSERVER_CA_CERT: ${{ secrets.DATAPULL_CI_SQLSERVER_CA_CERT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATAPULL_SQLSERVER_CA_CERT)) { exit 0 }
          $certificate = Join-Path $env:RUNNER_TEMP 'datapull-sqlserver-ca.cer'
          Set-Content -LiteralPath $certificate -Value $env:DATAPULL_SQLSERVER_CA_CERT -Encoding ascii
          Import-Certificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\Root | Out-Null

      - name: 信任 SQL Server CA（macOS）
        if: inputs.bootstrap == 'macos'
        shell: bash
        env:
          DATAPULL_SQLSERVER_CA_CERT: ${{ secrets.DATAPULL_CI_SQLSERVER_CA_CERT }}
        run: |
          if [[ -z "$DATAPULL_SQLSERVER_CA_CERT" ]]; then
            exit 0
          fi
          certificate="$RUNNER_TEMP/datapull-sqlserver-ca.pem"
          printf '%s\n' "$DATAPULL_SQLSERVER_CA_CERT" > "$certificate"
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$certificate"

      - name: 信任 SQL Server CA（Ubuntu）
        if: inputs.bootstrap == 'ubuntu'
        shell: bash
        env:
          DATAPULL_SQLSERVER_CA_CERT: ${{ secrets.DATAPULL_CI_SQLSERVER_CA_CERT }}
        run: |
          if [[ -z "$DATAPULL_SQLSERVER_CA_CERT" ]]; then
            exit 0
          fi
          certificate="$RUNNER_TEMP/datapull-sqlserver-ca.crt"
          printf '%s\n' "$DATAPULL_SQLSERVER_CA_CERT" > "$certificate"
          sudo install -m 0644 "$certificate" \
            /usr/local/share/ca-certificates/datapull-sqlserver-ca.crt
          sudo update-ca-certificates

      - name: 安装项目依赖并执行本地门禁
        working-directory: cli/datapull
        run: npm ci --ignore-scripts

      - name: 构建并测试发布包
        working-directory: cli/datapull
        run: npm run prepack

      - name: 执行三数据库兼容性验收
        working-directory: cli/datapull
        env:
          DATAPULL_CI_PLATFORM: ${{ inputs.platform }}
          DATAPULL_CI_INSTALL_MISSING: ${{ inputs.install_missing }}
          DATAPULL_CI_MYSQL_HOST: ${{ secrets.DATAPULL_CI_MYSQL_HOST }}
          DATAPULL_CI_MYSQL_PORT: ${{ secrets.DATAPULL_CI_MYSQL_PORT }}
          DATAPULL_CI_MYSQL_USERNAME: ${{ secrets.DATAPULL_CI_MYSQL_USERNAME }}
          DATAPULL_CI_MYSQL_PASSWORD: ${{ secrets.DATAPULL_CI_MYSQL_PASSWORD }}
          DATAPULL_CI_MYSQL_DATABASE: ${{ secrets.DATAPULL_CI_MYSQL_DATABASE }}
          DATAPULL_CI_MYSQL_SSL_MODE: ${{ secrets.DATAPULL_CI_MYSQL_SSL_MODE }}
          DATAPULL_CI_POSTGRESQL_HOST: ${{ secrets.DATAPULL_CI_POSTGRESQL_HOST }}
          DATAPULL_CI_POSTGRESQL_PORT: ${{ secrets.DATAPULL_CI_POSTGRESQL_PORT }}
          DATAPULL_CI_POSTGRESQL_USERNAME: ${{ secrets.DATAPULL_CI_POSTGRESQL_USERNAME }}
          DATAPULL_CI_POSTGRESQL_PASSWORD: ${{ secrets.DATAPULL_CI_POSTGRESQL_PASSWORD }}
          DATAPULL_CI_POSTGRESQL_DATABASE: ${{ secrets.DATAPULL_CI_POSTGRESQL_DATABASE }}
          DATAPULL_CI_POSTGRESQL_SSL_MODE: ${{ secrets.DATAPULL_CI_POSTGRESQL_SSL_MODE }}
          DATAPULL_CI_SQLSERVER_HOST: ${{ secrets.DATAPULL_CI_SQLSERVER_HOST }}
          DATAPULL_CI_SQLSERVER_PORT: ${{ secrets.DATAPULL_CI_SQLSERVER_PORT }}
          DATAPULL_CI_SQLSERVER_USERNAME: ${{ secrets.DATAPULL_CI_SQLSERVER_USERNAME }}
          DATAPULL_CI_SQLSERVER_PASSWORD: ${{ secrets.DATAPULL_CI_SQLSERVER_PASSWORD }}
          DATAPULL_CI_SQLSERVER_DATABASE: ${{ secrets.DATAPULL_CI_SQLSERVER_DATABASE }}
          DATAPULL_SQLSERVER_EXPORT_TIMEOUT_MS: 180000
        run: npm run ci:compatibility

      - name: 上传脱敏验收证据
        uses: actions/upload-artifact@v7
        with:
          name: datapull-compatibility-${{ inputs.platform }}
          path: cli/datapull/ci-evidence/${{ inputs.platform }}.json
          if-no-files-found: error
          retention-days: 30
