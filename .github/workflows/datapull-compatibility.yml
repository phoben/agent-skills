name: DataPull 兼容性验收

on:
  workflow_dispatch:
    inputs:
      target:
        description: 要执行的平台；hosted 运行全部托管平台
        required: true
        default: hosted
        type: choice
        options:
          - hosted
          - macos
          - ubuntu-lts
          - windows-server-2025
          - debian-stable
          - fedora-current
          - all
      install_missing:
        description: 是否允许 DataPull 自动安装缺少的数据库工具
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  macos:
    if: inputs.target == 'hosted' || inputs.target == 'macos' || inputs.target == 'all'
    uses: ./.github/workflows/datapull-compatibility-platform.yml
    with:
      platform: macos
      runs_on: '"macos-15-intel"'
      bootstrap: macos
      install_missing: ${{ inputs.install_missing }}
    secrets: inherit

  ubuntu:
    if: inputs.target == 'hosted' || inputs.target == 'ubuntu-lts' || inputs.target == 'all'
    uses: ./.github/workflows/datapull-compatibility-platform.yml
    with:
      platform: ubuntu-lts
      runs_on: '"ubuntu-24.04"'
      bootstrap: ubuntu
      install_missing: ${{ inputs.install_missing }}
    secrets: inherit

  windows:
    if: inputs.target == 'hosted' || inputs.target == 'windows-server-2025' || inputs.target == 'all'
    uses: ./.github/workflows/datapull-compatibility-platform.yml
    with:
      platform: windows-server-2025
      runs_on: '"windows-2025"'
      bootstrap: windows
      install_missing: ${{ inputs.install_missing }}
    secrets: inherit

  debian:
    if: inputs.target == 'hosted' || inputs.target == 'debian-stable' || inputs.target == 'all'
    uses: ./.github/workflows/datapull-compatibility-container.yml
    with:
      platform: debian-stable
      container_image: debian:stable-slim
      bootstrap: debian
      install_missing: ${{ inputs.install_missing }}
    secrets: inherit

  fedora:
    if: inputs.target == 'hosted' || inputs.target == 'fedora-current' || inputs.target == 'all'
    uses: ./.github/workflows/datapull-compatibility-container.yml
    with:
      platform: fedora-current
      container_image: fedora:latest
      bootstrap: fedora
      install_missing: ${{ inputs.install_missing }}
    secrets: inherit
